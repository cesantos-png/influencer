<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hub de influencers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF0EE; --surface:#FFFFFF; --surface-2:#F3F7F6; --ink:#14211F; --muted:#566865; --line:#D2DDDA; --line-soft:#E6EDEB;
  --accent:#0B6E66; --accent-ink:#FFFFFF; --accent-soft:#D5ECE7;
  --quero:#0B6E66; --quero-ink:#FFFFFF;
  --disp:#A9DDD0; --disp-ink:#0D3B35;
  --bloq:#D3D9DB; --bloq-ink:#46525A;
  --conf:#5A3E97; --conf-ink:#FFFFFF;
  --danger:#B3261E;
  --shadow:0 1px 0 rgba(20,40,36,.05), 0 10px 28px -16px rgba(20,40,36,.25);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0D1514; --surface:#15201E; --surface-2:#1B2826; --ink:#E3EDEA; --muted:#98ACA7; --line:#2A3A37; --line-soft:#21302D;
    --accent:#45B8AA; --accent-ink:#05201C; --accent-soft:#1D3A35;
    --quero:#45B8AA; --quero-ink:#05201C;
    --disp:#2B5A52; --disp-ink:#D2F0E9;
    --bloq:#374245; --bloq-ink:#B9C4C6;
    --conf:#A28BDB; --conf-ink:#170D2E;
    --danger:#F2867E;
    --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.6);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0D1514; --surface:#15201E; --surface-2:#1B2826; --ink:#E3EDEA; --muted:#98ACA7; --line:#2A3A37; --line-soft:#21302D;
  --accent:#45B8AA; --accent-ink:#05201C; --accent-soft:#1D3A35;
  --quero:#45B8AA; --quero-ink:#05201C;
  --disp:#2B5A52; --disp-ink:#D2F0E9;
  --bloq:#374245; --bloq-ink:#B9C4C6;
  --conf:#A28BDB; --conf-ink:#170D2E;
  --danger:#F2867E;
  --shadow:0 1px 0 rgba(0,0,0,.3), 0 10px 28px -16px rgba(0,0,0,.6);
  color-scheme:dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
body{ margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
h1,h2,h3{ font-family:"Bricolage Grotesque", "Instrument Sans", system-ui, sans-serif; letter-spacing:-.01em; margin:0; }
button,input,select,textarea{ font:inherit; color:inherit; }
:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }
img{ max-width:100%; }
.wrap{ max-width:1280px; margin:0 auto; padding:0 20px; }

/* Header */
.top{ background:var(--surface); border-bottom:1px solid var(--line); }
.top .wrap{ display:flex; flex-wrap:wrap; align-items:center; gap:14px 28px; padding-top:16px; padding-bottom:0; }
.brand h1{ font-size:24px; font-weight:700; }
.brand p{ margin:0; color:var(--muted); font-size:13px; }
.me{ margin-left:auto; display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
.me select{ max-width:240px; }
.tabs{ flex-basis:100%; display:flex; gap:4px; overflow-x:auto; }
.tab{ background:none; border:0; padding:12px 14px 13px; cursor:pointer; color:var(--muted); font-weight:600; border-bottom:3px solid transparent; white-space:nowrap; }
.tab[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--accent); }
.tab .n{ display:inline-block; min-width:20px; margin-left:6px; padding:0 6px; border-radius:10px; background:var(--surface-2); font-size:12px; color:var(--muted); }

/* Controls */
.toolbar{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; padding:20px 0 14px; }
.grow{ flex:1; }
input[type=search],input[type=text],input[type=number],input[type=date],input[type=url],select,textarea{
  background:var(--surface); border:1px solid var(--line); border-radius:8px; padding:8px 10px; min-height:38px; }
textarea{ width:100%; min-height:80px; resize:vertical; }
input[type=search]{ min-width:220px; flex:0 1 280px; }
.btn{ border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:8px 14px; min-height:38px; cursor:pointer; font-weight:600; }
.btn:hover{ border-color:var(--muted); }
.btn.primary{ background:var(--accent); color:var(--accent-ink); border-color:var(--accent); }
.btn.primary:hover{ filter:brightness(1.07); }
.btn.ghost{ background:none; border-color:transparent; color:var(--muted); }
.btn.danger{ color:var(--danger); }
.btn.sm{ min-height:30px; padding:4px 10px; font-size:13px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }

.summary{ color:var(--muted); margin:0 0 16px; font-size:14px; }
.summary b{ color:var(--ink); }

/* Influencer cards */
.grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:16px; padding-bottom:40px; }
.card{ background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; display:flex; flex-direction:column; gap:12px; box-shadow:var(--shadow); }
.who{ display:flex; gap:12px; align-items:center; }
.av{ flex:none; width:46px; height:46px; border-radius:50%; display:grid; place-items:center; color:#fff; font-weight:700; font-family:"Bricolage Grotesque",sans-serif; font-size:17px; }
.who h3{ font-size:18px; line-height:1.2; }
.who .h{ color:var(--muted); font-size:13px; }
.pill{ display:inline-block; font-size:12px; font-weight:600; padding:2px 9px; border-radius:20px; background:var(--surface-2); color:var(--muted); border:1px solid var(--line); white-space:nowrap; }
.pill.aberto{ background:var(--accent-soft); color:var(--accent); border-color:transparent; }
.pill.agendado{ background:var(--conf); color:var(--conf-ink); border-color:transparent; }
.pill.realizado{ background:var(--ink); color:var(--surface); border-color:transparent; }
.pill.recusado{ text-decoration:line-through; }
.stats{ display:grid; grid-template-columns:1.3fr 1fr 1fr; border-top:1px solid var(--line-soft); border-bottom:1px solid var(--line-soft); padding:10px 0; }
.stat b{ display:block; font-family:"Bricolage Grotesque",sans-serif; font-size:22px; line-height:1.1; font-weight:700; }
.stat span{ font-size:12px; color:var(--muted); }
.stat + .stat{ padding-left:12px; border-left:1px solid var(--line-soft); }
.facts{ margin:0; display:grid; grid-template-columns:auto 1fr; gap:4px 12px; font-size:13.5px; }
.facts dt{ color:var(--muted); }
.facts dd{ margin:0; }
.why{ font-size:14px; margin:0; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.card footer{ margin-top:auto; display:flex; align-items:center; gap:10px; }
.interest{ font-size:13px; color:var(--muted); }
.interest.has{ color:var(--accent); font-weight:600; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; }
.chip{ font-size:12px; padding:2px 8px; border-radius:6px; background:var(--surface-2); border:1px solid var(--line-soft); }

/* Empty */
.empty{ background:var(--surface); border:1px dashed var(--line); border-radius:14px; padding:40px 24px; text-align:center; max-width:560px; margin:24px auto 60px; }
.empty h2{ font-size:20px; margin-bottom:6px; }
.empty p{ color:var(--muted); margin:0 0 16px; }

/* Agenda */
.regions{ display:flex; flex-wrap:wrap; gap:8px; }
.reg{ border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:6px 12px; cursor:pointer; text-align:left; line-height:1.25; }
.reg b{ display:block; font-size:14px; }
.reg small{ color:var(--muted); font-size:12px; }
.reg[aria-pressed="true"]{ background:var(--ink); color:var(--surface); border-color:var(--ink); }
.reg[aria-pressed="true"] small{ color:inherit; opacity:.75; }
.month{ display:flex; align-items:center; gap:4px; }
.month h2{ font-size:20px; min-width:170px; text-align:center; }
.legend{ display:flex; flex-wrap:wrap; gap:14px; font-size:13px; color:var(--muted); margin-bottom:12px; }
.legend i{ display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:6px; }
.k-quero{ background:var(--quero); color:var(--quero-ink); }
.k-disponivel{ background:var(--disp); color:var(--disp-ink); }
.k-bloqueado{ background:repeating-linear-gradient(135deg,var(--bloq) 0 5px,var(--surface-2) 5px 9px); color:var(--bloq-ink); }
.k-confirmado{ background:var(--conf); color:var(--conf-ink); }

.tl-wrap{ overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:40px; }
.tl{ min-width:calc(210px + var(--days) * 32px); }
.tl-row{ display:grid; grid-template-columns:210px 1fr; border-bottom:1px solid var(--line-soft); }
.tl-row:last-child{ border-bottom:0; }
.tl-name{ position:sticky; left:0; z-index:3; background:var(--surface); padding:8px 12px; border-right:1px solid var(--line); line-height:1.25; min-width:0; }
.tl-name b{ display:block; font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.tl-name small{ color:var(--muted); font-size:12px; }
.tl-name.mine b::after{ content:"seu hotel"; margin-left:6px; font-size:10.5px; font-weight:600; color:var(--accent); }
.tl-head .tl-name{ font-size:12px; color:var(--muted); display:flex; align-items:end; }
.tl-days{ display:grid; grid-template-columns:repeat(var(--days),1fr); }
.tl-days span{ text-align:center; font-size:11.5px; color:var(--muted); padding:8px 0 6px; line-height:1.15; }
.tl-days span small{ display:block; font-size:10px; opacity:.8; }
.tl-days span.we{ background:var(--surface-2); }
.tl-days span.td{ color:var(--accent); font-weight:700; }
.tl-track{ position:relative; cursor:cell; min-height:40px; }
.tl-grid{ position:absolute; inset:0; display:grid; grid-template-columns:repeat(var(--days),1fr); pointer-events:none; }
.tl-grid span{ border-left:1px solid var(--line-soft); }
.tl-grid span.we{ background:var(--surface-2); }
.tl-grid span.td{ box-shadow:inset 2px 0 0 var(--accent); }
.span{ position:absolute; height:24px; border-radius:6px; font-size:12px; font-weight:600; padding:0 7px; border:0; cursor:pointer; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; z-index:1; }
.span:hover{ filter:brightness(1.06); box-shadow:0 0 0 2px var(--surface), 0 0 0 3px var(--ink); }
.tl-hint{ font-size:13px; color:var(--muted); margin:-4px 0 12px; }

/* Hotels table */
.table-wrap{ overflow-x:auto; background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:40px; }
table{ border-collapse:collapse; width:100%; font-size:14px; }
th,td{ text-align:left; padding:10px 14px; border-bottom:1px solid var(--line-soft); white-space:nowrap; }
th{ font-size:12.5px; color:var(--muted); font-weight:600; background:var(--surface-2); }
tr:last-child td{ border-bottom:0; }
td.num{ text-align:right; }

/* Dialog */
dialog{ border:0; border-radius:16px; padding:0; width:min(720px, calc(100vw - 24px)); max-height:calc(100dvh - 32px); background:var(--surface); color:var(--ink); box-shadow:0 30px 80px -20px rgba(0,0,0,.45); }
dialog::backdrop{ background:rgba(10,20,18,.45); }
.dlg-h{ position:sticky; top:0; z-index:2; background:var(--surface); display:flex; align-items:center; gap:12px; padding:18px 22px 14px; border-bottom:1px solid var(--line-soft); }
.dlg-h h2{ font-size:20px; flex:1; }
.dlg-b{ padding:18px 22px 22px; }
.dlg-f{ position:sticky; bottom:0; background:var(--surface); display:flex; flex-wrap:wrap; gap:10px; padding:14px 22px; border-top:1px solid var(--line-soft); }
.form{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:14px 16px; }
.form .full{ grid-column:1 / -1; }
.form label{ display:flex; flex-direction:column; gap:5px; font-size:13px; font-weight:600; }
.form label > span.hint{ font-weight:400; color:var(--muted); font-size:12px; }
.form input,.form select{ width:100%; }
.checks{ display:flex; flex-wrap:wrap; gap:8px; }
.chk{ display:flex !important; flex-direction:row !important; align-items:center; gap:6px; font-weight:500 !important; border:1px solid var(--line); border-radius:8px; padding:6px 10px; cursor:pointer; }
.seg{ display:flex; flex-wrap:wrap; gap:6px; }
.seg label{ flex-direction:row; align-items:center; gap:8px; border:1px solid var(--line); border-radius:8px; padding:7px 12px; cursor:pointer; font-weight:500; }
.seg input{ width:auto; margin:0; }
.section{ margin-top:22px; }
.section h3{ font-size:16px; margin-bottom:10px; }
.list{ display:flex; flex-direction:column; border:1px solid var(--line-soft); border-radius:10px; }
.li{ display:flex; gap:12px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line-soft); flex-wrap:wrap; }
.li:last-child{ border-bottom:0; }
.li .t{ flex:1; min-width:180px; }
.li .t b{ display:block; font-size:14px; }
.li .t small{ color:var(--muted); }
.callout{ background:var(--accent-soft); border-radius:10px; padding:12px 14px; margin-top:16px; }
.callout b{ display:block; font-size:13px; color:var(--accent); margin-bottom:2px; }
.callout p{ margin:0; }
.muted{ color:var(--muted); }
.big-stats{ display:grid; grid-template-columns:repeat(3,1fr); gap:10px; margin-bottom:16px; }
.big-stats .stat{ background:var(--surface-2); border-radius:10px; padding:10px 12px; border:0 !important; }
.mine-pick{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }

.kit{ display:flex; align-items:center; gap:12px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; text-decoration:none; color:var(--ink); margin-top:14px; }
.kit:hover{ border-color:var(--accent); }
.kit-ic{ flex:none; width:40px; height:40px; border-radius:8px; background:var(--accent); color:var(--accent-ink); display:grid; place-items:center; font-weight:700; font-size:12px; }
.kit b{ display:block; font-size:14px; }
.kit small{ color:var(--muted); font-size:12px; }
.kit-cur{ display:flex; align-items:center; gap:8px; margin-bottom:8px; font-size:14px; }
.sig{ display:inline-block; font-weight:700; color:var(--accent); margin-right:6px; letter-spacing:.02em; }
.pill.novo{ background:var(--ink); color:var(--surface); border-color:transparent; margin-right:4px; }
#toast{ position:fixed; left:50%; bottom:calc(20px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%) translateY(20px); background:var(--ink); color:var(--surface); padding:10px 16px; border-radius:10px; font-size:14px; opacity:0; pointer-events:none; transition:opacity .2s, transform .2s; z-index:50; max-width:calc(100vw - 32px); }
#toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }
#toast.err{ background:var(--danger); color:#fff; }

@media (max-width:640px){
  .wrap{ padding:0 14px; }
  .me{ margin-left:0; flex-basis:100%; }
  .me select{ flex:1; max-width:none; }
  .form{ grid-template-columns:1fr; }
  .tl{ min-width:calc(140px + var(--days) * 30px); }
  .tl-row{ grid-template-columns:140px 1fr; }
  .month h2{ min-width:130px; font-size:17px; }
  .big-stats{ grid-template-columns:1fr 1fr 1fr; }
  input[type=search]{ flex:1 1 100%; }
}
@media (prefers-reduced-motion: reduce){ #toast{ transition:none; } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand">
      <h1>Hub de influencers</h1>
      <p id="sub">Parcerias com influencers em toda a rede</p>
    </div>
    <label class="me">Meu hotel
      <select id="myHotel" aria-label="Meu hotel"><option value="">Escolha seu hotel</option></select>
    </label>
    <nav class="tabs" role="tablist">
      <button class="tab" role="tab" data-tab="inf" aria-selected="true">Influencers<span class="n" id="nInf">0</span></button>
      <button class="tab" role="tab" data-tab="ag" aria-selected="false">Agenda por NAR</button>
      <button class="tab" role="tab" data-tab="hot" aria-selected="false">Hotéis<span class="n" id="nHot">0</span></button>
    </nav>
  </div>
</header>
<main class="wrap" id="view"></main>
<dialog id="dlg"><div id="dlgBody"></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>

<script src="/claude-shim.js"></script>
<script>
/* ---------- Constantes ---------- */
const REGIOES = ["Norte","Nordeste","Centro-Oeste","Sudeste","Sul"];
const NARS = ["1","2","3","4","Franquia"];
const narLabel = n => n === "Franquia" ? "Franquias" : "NAR " + n;
const UF_REG = {AC:"Norte",AP:"Norte",AM:"Norte",PA:"Norte",RO:"Norte",RR:"Norte",TO:"Norte",
  AL:"Nordeste",BA:"Nordeste",CE:"Nordeste",MA:"Nordeste",PB:"Nordeste",PE:"Nordeste",PI:"Nordeste",RN:"Nordeste",SE:"Nordeste",
  DF:"Centro-Oeste",GO:"Centro-Oeste",MT:"Centro-Oeste",MS:"Centro-Oeste",
  ES:"Sudeste",MG:"Sudeste",RJ:"Sudeste",SP:"Sudeste",PR:"Sul",RS:"Sul",SC:"Sul"};
const NICHOS = ["Viagem","Lifestyle","Família","Gastronomia","Luxo","Negócios","Bem-estar","Outro"];
const PLATS = ["Instagram","TikTok","YouTube","Outra"];
const PROPOSTAS = ["Permuta","Cachê","Permuta + cachê"];
const ORIGENS = ["E-mail","DM","Indicação","Outro"];
const STATUS = {analise:"Em análise",aberto:"Aberto para hotéis",agendado:"Agendado",realizado:"Realizado",recusado:"Recusado"};
const STATUS_ORD = ["aberto","analise","agendado","realizado","recusado"];
const PUBLIC_STATUS = ["aberto","agendado","realizado"];
const TIPOS = {quero:"Quero influencer",disponivel:"Disponível",bloqueado:"Bloqueado",confirmado:"Confirmado"};
const MES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const MES_L = ["Janeiro","Fevereiro","Março","Abril","Maio","Junho","Julho","Agosto","Setembro","Outubro","Novembro","Dezembro"];
const SEM = ["D","S","T","Q","Q","S","S"];

/* ---------- Utilidades ---------- */
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad = n => String(n).padStart(2,"0");
const isoOf = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const NOW = new Date();
const TODAY = isoOf(NOW.getFullYear(), NOW.getMonth(), NOW.getDate());
const fmtD = s => { if(!s) return ""; const [y,m,d] = s.split("-").map(Number); return `${d} ${MES[m-1]}` + (y !== NOW.getFullYear() ? ` ${y}` : ""); };
const fmtRange = (a,b) => !a ? "Datas flexíveis" : (!b || a === b ? fmtD(a) : `${fmtD(a)} a ${fmtD(b)}`);
const fmtN = n => { n = Number(n) || 0; if (n >= 1e6) return (n/1e6).toFixed(1).replace(".",",").replace(",0","") + " mi"; if (n >= 1e3) return Math.round(n/1e3) + " mil"; return String(n); };
const fmtPct = n => (n || n === 0) && n !== "" ? String(n).replace(".",",") + "%" : "–";
const newId = p => p + "-" + Math.random().toString(36).slice(2,8) + Date.now().toString(36).slice(-4);
const initials = n => String(n||"?").replace(/\(.*?\)/g,"").trim().split(/\s+/).slice(0,2).map(w=>w[0]||"").join("").toUpperCase() || "?";
const hue = s => { let h = 0; for (const c of String(s)) h = (h*31 + c.charCodeAt(0)) % 360; return h; };
const overlaps = (a1,b1,a2,b2) => a1 <= b2 && a2 <= b1;

/* ---------- Estado ---------- */
const S = {
  db:null, user:null, assets:null, kitRemove:false, uid:null, isAdmin:false, canWrite:true, noDb:false,
  infs:[], hotels:[], agenda:[], ints:[], loaded:{inf:false,hot:false,ag:false,int:false},
  myHotel:"", tab:"inf", region:"1", cfg:{}, ym:[NOW.getFullYear(), NOW.getMonth()],
  f:{q:"",reg:"",nicho:"",status:""}, hf:{q:"",reg:""}, dlg:null, regionChosen:false
};
const C = {
  inf: () => S.db.collection("core/admin/influencers"),
  hot: () => S.db.collection("core/admin/hoteis"),
  ag:  () => S.db.collection("agenda"),
  int: () => S.db.collection("interesses"),
};
const hotelMap = () => Object.fromEntries(S.hotels.map(h => [h.id, h]));
const allLoaded = () => Object.values(S.loaded).every(Boolean);

/* ---------- Toast e escrita segura ---------- */
let toastT;
function toast(msg, err=false){
  const t = $("#toast"); t.textContent = msg; t.className = "on" + (err ? " err" : "");
  clearTimeout(toastT); toastT = setTimeout(() => t.className = "", 3200);
}
function errMsg(e){
  const c = e && e.code;
  if (c === "invalid_argument") return "Você não tem permissão para alterar isso. Peça acesso de Colaborador a quem administra o hub.";
  if (c === "quota_exceeded") return "O hub atingiu o limite de registros. Exclua datas antigas para continuar.";
  if (c === "revoked" || c === "not_granted") return "Seu acesso a este hub mudou. Recarregue a página.";
  return "Não foi possível salvar agora. Tente de novo em instantes.";
}
async function safe(fn, okMsg){
  try { await fn(); }
  catch (e) {
    if (e && e.code === "unavailable") {
      await new Promise(r => setTimeout(r, 400 + Math.random()*700));
      try { await fn(); } catch (e2) { toast(errMsg(e2), true); return false; }
    } else { toast(errMsg(e), true); return false; }
  }
  if (okMsg) toast(okMsg);
  return true;
}

function hotelOptions(sel, emptyLabel){
  let o = emptyLabel ? `<option value="">${esc(emptyLabel)}</option>` : "";

    const hs = S.hotels.filter(h => h.nar === r).sort((a,b) => (a.sigla||a.nome||"").localeCompare(b.sigla||b.nome||""));

    o += `<optgroup label="${narLabel(r)}">` + hs.map(h => `<option value="${esc(h.id)}" ${h.id===sel?"selected":""}>${h.sigla?esc(h.sigla)+" – ":""}${esc(h.nome)}${h.cidade?` (${esc(h.cidade)})`:""}</option>`).join("") + `</optgroup>`;
  }
  const other = S.hotels.filter(h => !NARS.includes(h.nar));
  if (other.length) o += `<optgroup label="Sem NAR">` + other.map(h => `<option value="${esc(h.id)}" ${h.id===sel?"selected":""}>${h.sigla?esc(h.sigla)+" – ":""}${esc(h.nome)}</option>`).join("") + `</optgroup>`;

function compatible(i){
  const regs = i.regioes || [];
  const a = i.inicio || TODAY, z = i.fim || i.inicio || "9999-12-31";
  const hm = hotelMap(); const out = {};
  for (const e of S.agenda) {
    if (!["quero","disponivel"].includes(e.tipo)) continue;
    const h = hm[e.hotelId]; if (!h) continue;
    if (regs.length && !regs.includes(h.regiao)) continue;
    if ((e.fim||e.inicio) < TODAY) continue;
    if (!overlaps(e.inicio, e.fim||e.inicio, a, z)) continue;
    (out[h.id] = out[h.id] || {h, es:[]}).es.push(e);
  }
  return Object.values(out).sort((x,y) => (y.es.some(e=>e.tipo==="quero") - x.es.some(e=>e.tipo==="quero")) || x.h.nome.localeCompare(y.h.nome));
}

async function saveInf(id){
  const v = s => $(s).value.trim();
  const nome = v("#f_nome");
  if (!nome) { toast("Preencha o nome do influencer.", true); $("#f_nome").focus(); return; }
  const ini = v("#f_ini"), fim = v("#f_fim");
  if (ini && fim && fim < ini) { toast("A data final vem antes da inicial. Corrija o período.", true); return; }
  const prev = id ? S.infs.find(x => x.id === id) : null;
  const num = s => { const x = v(s); return x === "" ? "" : Number(x); };
  const data = {
    nome, handle: v("#f_handle").replace(/^@/,""), plataforma: v("#f_plat"), link: v("#f_link"),
    seguidores: num("#f_seg"), engajamento: num("#f_eng"), views: num("#f_views"), nicho: v("#f_nicho"),
    publico: v("#f_pub"), cidade: v("#f_cid"), status: v("#f_status"),
    regioes: [...document.querySelectorAll('input[name=f_reg]:checked')].map(x => x.value),
    inicio: ini, fim: fim || ini, proposta: v("#f_prop"), cache: v("#f_cache"), entregaveis: v("#f_ent"),
    porque: v("#f_porque"), origem: v("#f_orig"), contato: v("#f_cont"), resultado: v("#f_res"),
    hotelConfirmado: prev?.hotelConfirmado || "", createdAt: prev?.createdAt || Date.now(), updatedAt: Date.now()
  };
  let kit = prev?.midiaKit || null;
  if (S.kitRemove) kit = null;
  const file = $("#f_kit")?.files?.[0];
  if (file) {
    if (!["application/pdf","image/png","image/jpeg","image/webp"].includes(file.type)) return toast("Envie o mídia kit em PDF, PNG, JPG ou WEBP.", true);
    if (file.size > 20*1024*1024) return toast("O arquivo passa de 20 MB. Comprima o PDF e tente de novo.", true);
    const btn = $("[data-act=saveInf]"); if (btn) { btn.disabled = true; btn.textContent = "Enviando mídia kit…"; }
    try { const r = await S.assets.upload(file, { type: file.type }); kit = { id: r.id, nome: file.name, tipo: file.type, tamanho: r.sizeBytes }; }
    catch (e) { if (btn) { btn.disabled = false; btn.textContent = "Salvar influencer"; } return toast(e && e.code === "quota_exceeded" ? "O espaço de arquivos do hub está cheio. Remova mídia kits antigos." : "Não foi possível enviar o mídia kit. Tente de novo.", true); }
  }
  data.midiaKit = kit;
  const docId = id || newId("inf");
  const ok = await safe(() => C.inf().doc(docId).set(data), id ? "Influencer atualizado" : "Influencer cadastrado");
  data.notificadoEm = prev?.notificadoEm || 0; data.notificadoQtd = prev?.notificadoQtd || 0;
  if (ok && prev?.midiaKit && prev.midiaKit.id !== kit?.id && S.assets) S.assets.delete(prev.midiaKit.id).catch(() => {});
  if (ok) { if (data.status === "aberto" && (!prev || prev.status !== "aberto") && !data.notificadoEm) notifyForm(docId); else openInf(docId); }
}

function shiftMonth(d){ let [y,m] = S.ym; m += d; if (m < 0) { m = 11; y--; } if (m > 11) { m = 0; y++; } S.ym = [y,m]; renderBody(); }
function renderAgenda(b){
  const [y,m] = S.ym; const days = new Date(y, m+1, 0).getDate();
  const ms = isoOf(y,m,1), me = isoOf(y,m,days);
  const inMonth = e => overlaps(e.inicio, e.fim||e.inicio, ms, me);
  const hm = hotelMap();

  const regStats = r => {
    const hs = S.hotels.filter(h => h.nar === r); const ids = new Set(hs.map(h=>h.id));
    const q = new Set(S.agenda.filter(e => ids.has(e.hotelId) && e.tipo === "quero" && inMonth(e)).map(e=>e.hotelId)).size;
    return { n: hs.length, q };
  };
  $("#agTop").innerHTML = `<div class="toolbar">
    <div class="regions" role="group" aria-label="NAR">${NARS.map(r => { const s = regStats(r); return `<button class="reg" data-act="reg" data-r="${r}" aria-pressed="${S.region===r}"><b>${narLabel(r)}</b><small>${s.n} ${s.n===1?"hotel":"hotéis"}${s.q?`, ${s.q} querendo`:""}</small></button>`; }).join("")}</div>
    <span class="grow"></span>
    <div class="month"><button class="btn ghost" data-act="prevM" aria-label="Mês anterior">‹</button><h2>${MES_L[m]} ${y}</h2><button class="btn ghost" data-act="nextM" aria-label="Próximo mês">›</button></div>
    ${S.canWrite && S.hotels.length ? `<button class="btn primary" data-act="newEntry">Marcar datas</button>` : ""}
  </div>`;

  let hs = S.hotels.filter(h => h.nar === S.region).sort((a,b) => (a.uf||"").localeCompare(b.uf||"") || (a.cidade||"").localeCompare(b.cidade||"") || (a.nome||"").localeCompare(b.nome||""));
  if (S.myHotel) { const i = hs.findIndex(h => h.id === S.myHotel); if (i > 0) hs.unshift(hs.splice(i,1)[0]); }

  if (!S.hotels.length) {
    b.innerHTML = `<div class="empty"><h2>Cadastre os hotéis primeiro</h2><p>A agenda mostra uma linha por hotel. Importe a lista dos 165 hotéis de uma vez na aba Hotéis.</p>${S.isAdmin?`<button class="btn primary" data-act="goHot">Ir para Hotéis</button>`:""}</div>`;
    return;
  }
  if (!hs.length) { b.innerHTML = `<div class="empty"><h2>Nenhum hotel em ${esc(narLabel(S.region))}</h2><p>Escolha outra NAR acima${S.isAdmin?" ou cadastre hotéis desta NAR na aba Hotéis":""}.</p></div>`; return; }

  const ids = new Set(hs.map(h=>h.id));
  const ents = S.agenda.filter(e => ids.has(e.hotelId) && inMonth(e));
  const cnt = t => new Set(ents.filter(e=>e.tipo===t).map(e=>e.hotelId)).size;
  const nConf = ents.filter(e=>e.tipo==="confirmado").length;

  const dayCells = cls => { let s = ""; for (let d = 1; d <= days; d++) { const wd = new Date(y,m,d).getDay(); const c = [(wd===0||wd===6)?"we":"", isoOf(y,m,d)===TODAY?"td":""].join(" ").trim(); s += cls ? `<span class="${c}"><small>${SEM[wd]}</small>${d}</span>` : `<span class="${c}"></span>`; } return s; };
  const grid = dayCells(false);
  const infMap = Object.fromEntries(S.infs.map(i => [i.id, i]));

  const rows = hs.map(h => {
    const es = ents.filter(e => e.hotelId === h.id).sort((a,b) => a.inicio.localeCompare(b.inicio));
    const lanes = []; const placed = es.map(e => {
      const s = e.inicio < ms ? 1 : Number(e.inicio.slice(8)); const f = (e.fim||e.inicio) > me ? days : Number((e.fim||e.inicio).slice(8));
      let l = lanes.findIndex(end => end < s); if (l < 0) { l = lanes.length; lanes.push(0); } lanes[l] = f;
      return { e, s, f, l };
    });
    const hgt = Math.max(40, lanes.length * 28 + 12);
    const spans = placed.map(({e,s,f,l}) => {
      const label = e.tipo === "confirmado" ? (infMap[e.influencerId]?.nome || e.nota || "Influencer confirmado") : (TIPOS[e.tipo] + (e.nota ? `: ${e.nota}` : ""));
      return `<button class="span k-${e.tipo}" data-act="editEntry" data-id="${esc(e.id)}" style="left:calc(${(s-1)/days*100}% + 2px);width:calc(${(f-s+1)/days*100}% - 4px);top:${6 + l*28}px" title="${esc(label)}, ${esc(fmtRange(e.inicio,e.fim))}">${esc(label)}</button>`;
    }).join("");
    return `<div class="tl-row"><div class="tl-name ${h.id===S.myHotel?"mine":""}"><b>${esc(h.nome)}</b><small>${h.sigla?`<span class="sig">${esc(h.sigla)}</span>`:""}${esc([h.cidade,h.uf].filter(Boolean).join("/"))}</small></div>
      <div class="tl-track" data-hotel="${esc(h.id)}" style="height:${hgt}px"><div class="tl-grid">${grid}</div>${spans}</div></div>`;
  }).join("");

  b.innerHTML = `
    <p class="summary">Em ${MES_L[m].toLowerCase()} na ${esc(narLabel(S.region))}: <b>${cnt("quero")}</b> ${cnt("quero")===1?"hotel quer":"hotéis querem"} influencer, <b>${cnt("disponivel")}</b> ${cnt("disponivel")===1?"está disponível":"estão disponíveis"} e <b>${nConf}</b> ${nConf===1?"visita confirmada":"visitas confirmadas"}.</p>
    <div class="legend">${Object.entries(TIPOS).map(([k,v]) => `<span><i class="k-${k}"></i>${v}</span>`).join("")}</div>
    ${S.canWrite ? `<p class="tl-hint">Clique em um dia na linha do hotel para marcar datas. Clique numa marcação para editar.</p>` : ""}
    <div class="tl-wrap"><div class="tl" style="--days:${days}">
      <div class="tl-row tl-head"><div class="tl-name">Hotel</div><div class="tl-days">${dayCells(true)}</div></div>
      ${rows}
    </div></div>`;
}

function parseImport(txt){
  const existing = new Set(S.hotels.map(h => (h.nome||"").toLowerCase()));
  return txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean).map(l => {
    const p = l.split(/\t|;/).map(s => s.trim());

async function kitAttachment(i){
  if (!i.midiaKit) return null;
  try {
    const r = await fetch("/_blob/" + i.midiaKit.id); if (!r.ok) return null;
    const blob = await r.blob(); if (blob.size > KIT_MAX) return null;
    const b64 = await new Promise((ok, no) => { const f = new FileReader(); f.onload = () => ok(String(f.result).split(",")[1]); f.onerror = no; f.readAsDataURL(blob); });
    return { content: b64, filename: i.midiaKit.nome || "midia-kit.pdf", mimeType: i.midiaKit.tipo || blob.type || "application/pdf" };
  } catch { return null; }
}

function cleanSnippet(s){
  const d = document.createElement("textarea"); d.innerHTML = s || ""; let t = d.value;
  t = t.split(/\b(On .{0,80} wrote:|Em .{0,80} escreveu:)/)[0];
  t = t.replace(/Olá!?\s*O .{0,120}? tem interesse em receber .{0,80}?\./i, "").replace(/\s+/g, " ").trim();
  return t.slice(0, 220);
}
async function importReplies(){
  if (!S.mcp) return toast("A busca no Gmail não está disponível nesta tela.", true);
  const btn = $("[data-act=replies]"); if (btn) { btn.disabled = true; btn.textContent = "Buscando…"; }
  try {
    const res = await S.mcp.callTool("Gmail", "search_threads", { query: 'subject:"Tenho interesse" newer_than:180d', pageSize: 50 }, { cache: false });
    const data = res && (res.payload !== undefined ? res.payload : res);
    const threads = (data && data.threads) || [];
    const bySig = Object.fromEntries(S.hotels.filter(h => h.sigla).map(h => [h.sigla.toUpperCase(), h]));
    const infIds = new Set(S.infs.map(x => x.id)); const existing = new Set(S.ints.map(x => x.id));
    let novos = 0;
    for (const th of threads) for (const m of (th.messages || [])) {
      const subj = String(m.subject || "");
      if (/^\s*(re|res|fw|fwd|enc)\s*:/i.test(subj)) continue;
      const mi = subj.match(/#(inf-[a-z0-9-]+)/i), ms = subj.match(/\(([A-Za-z0-9]{2,10})\)/);
      if (!mi || !ms) continue;
      const infId = mi[1].toLowerCase(), h = bySig[ms[1].toUpperCase()];
      if (!infIds.has(infId) || !h) continue;
      const docId = `${infId}__${h.id}`; if (existing.has(docId)) continue;
      const okW = await safe(() => C.int().doc(docId).set({ influencerId: infId, hotelId: h.id, nota: cleanSnippet(m.snippet), at: Date.parse(m.date) || Date.now(), by: "email", remetente: String(m.sender || "").slice(0, 120) }));
      if (okW) { existing.add(docId); novos++; }
    }
    toast(novos ? `${novos} ${novos===1?"novo interesse registrado":"novos interesses registrados"} a partir do Gmail` : "Nenhuma resposta nova de interesse no Gmail.");
  } catch (e) { toast(mcpErr(e), true); }
  if (btn) { btn.disabled = false; btn.textContent = "Buscar respostas no Gmail"; }
}

    case "editHot": hotelForm(id); break;
    case "saveHot": saveHot(id); break;
    case "delHot": if (confirm("Excluir este hotel? As datas marcadas por ele continuam guardadas, mas somem da agenda.") && await safe(() => C.hot().doc(id).delete(), "Hotel excluído")) closeDlg(); break;
    case "importHot": importForm(); break;
    case "doImport": doImport(); break;
    case "notify": notifyForm(id); break;
    case "sendNotify": sendNotify(id, false); break;
    case "testNotify": sendNotify(id, true); break;
    case "replies": importReplies(); break;
    case "b2c": b2cForm(); break;
    case "doB2C": doB2C(); break;
  }
});

/* ---------- Início ---------- */
async function init(){
  try { S.myHotel = localStorage.getItem("hub-myHotel") || ""; } catch {}
  renderShell();
  if (!window.claude || typeof window.claude.use !== "function") { S.noDb = true; renderShell(); return; }
  const [db, user, assets] = await Promise.all([claude.use("db"), claude.use("user"), claude.use("assets")]);
  S.assets = assets;
  claude.use("mcp").then(m => { S.mcp = m; if (m && S.tab === "inf" && S.isAdmin) renderShell(); }).catch(() => {});
  if (!db) { S.noDb = true; renderShell(); return; }
  S.db = db; S.user = user;
  if (user) {
    try { S.isAdmin = await user.canEdit(); } catch {}
    try { const w = await user.can("data.write"); S.canWrite = w !== false; } catch {}
    try { S.uid = await user.id(); } catch {}
    try { S.myEmail = localStorage.getItem("hub-myEmail") || ""; } catch {}
  }
  $("#sub").textContent = S.isAdmin ? "Você administra o hub: cadastre influencers e confirme visitas" : "Veja os influencers e marque as datas do seu hotel";
  if (S.uid) { try { const p = await db.doc(`data/users/${S.uid}/prefs`).get(); if (p.exists && p.data().myHotel) S.myHotel = p.data().myHotel; } catch {} }
  const sub = (key, ref) => ref.onSnapshot(snap => {
    S[{inf:"infs",hot:"hotels",ag:"agenda",int:"ints"}[key]] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    S.loaded[key] = true;
    if (key === "hot" && !S.regionChosen) { const h = hotelMap()[S.myHotel]; if (h && NARS.includes(h.nar)) { S.region = h.nar; S.regionChosen = true; } }
    if (S.tab === "ag" && allLoaded() && $("#agTop")) {} 
    renderBody();
  }, err => { S.loaded[key] = true; if (err && err.code === "revoked") { S.noDb = true; renderShell(); } else renderBody(); });
  db.doc("core/admin/config/geral").onSnapshot(sn => { S.cfg = sn.exists ? sn.data() : {}; renderBody(); }, () => {});
  sub("inf", C.inf()); sub("hot", C.hot()); sub("ag", C.ag()); sub("int", C.int());
}
init();
</script>
